<!DOCTYPE html>
<html lang="en">
<head>

    <title>Admin Login</title>
    <link rel="stylesheet" href="style/form_style.css">
    <link rel="stylesheet" href="style/login_style.css">
</head>
<body>
    <div class="form_container">
    <h1>Admin Login</h1>

        <form action="" method="post">

            <label for="admID">Admin ID </label>
            <span class="form_error"> </span>

            <input type="text" name="" id="admID" class="form_elements">
            <br><br>
            <label for="pwdID">Password</label>
            <span class="form_error"></span>
            <input type="password" name="password" id="pwdID"  class="form_elements"> <br><br>

            <button type="submit" class="form_elements form_buttons">Login</button>
            
        </form> 
            <br>
            <button class="form_elements form_buttons" onclick="location.href='/'"> Back to Home </button>

    </div>
</body>
